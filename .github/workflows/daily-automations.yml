name: Jaikrishna Daily Automations Runner

on:
  schedule:
    # 02:30 UTC = 08:00 AM IST (Indian Standard Time: UTC+5:30)
    - cron: '30 2 * * *'
  # Allows triggering manually from the GitHub Actions tab anytime
  workflow_dispatch:

jobs:
  run-automations:
    name: Execute Daily Automations (Rules 2-7)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute Daily Automations Runner
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          APP_URL: https://jaikrishnabizzhub.in
        run: npx tsx scripts/run-automations.ts
